<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Optimize Prompt — Settings</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="container">
    <div class="header">
      <span class="logo-icon">✨</span>
      <div>
        <h1>Optimize Prompt</h1>
        <p class="subtitle">Settings</p>
      </div>
    </div>

    <div class="section">
      <label for="api-key">Gemini API Key</label>
      <div class="input-row">
        <input
          type="password"
          id="api-key"
          placeholder="AIza..."
          autocomplete="off"
          spellcheck="false"
        />
        <button id="toggle-visibility" title="Show/hide key">👁</button>
      </div>
      <p class="hint">
        Get your free key at 
        <a href="https://aistudio.google.com/app/apikey" target="_blank">Google AI Studio</a>
      </p>
    </div>

    <div class="section">
      <label>Keyboard Shortcut</label>
      <div class="shortcut-display">
        <kbd>Ctrl</kbd><span>+</span><kbd>Shift</kbd><span>+</span><kbd>O</kbd>
        <span class="mac-note">(Mac: ⌘ Shift O)</span>
      </div>
      <p class="hint">
        Change it at <code>chrome://extensions/shortcuts</code>
      </p>
    </div>

    <div class="section">
      <label>Supported Platforms</label>
      <div class="platforms">
        <span class="platform-badge">Claude</span>
        <span class="platform-badge">ChatGPT</span>
        <span class="platform-badge">Gemini</span>
      </div>
    </div>

    <div class="footer">
      <span id="status-msg" class="status-msg"></span>
      <button id="save-btn" class="save-btn">Save</button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
